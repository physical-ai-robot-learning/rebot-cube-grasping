name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Isaac-free parts; CPU torch for the deploy loops)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install imageio imageio-ffmpeg
      - name: Compile (whole repository)
        run: python -m compileall -q src scripts analysis tests archive
      - name: Project 2 log summary matches the raw logs
        run: python analysis/parse_logs.py --check
      - name: Re-evaluation script (dry run)
        run: DRY_RUN=1 OUT=/tmp/p2eval bash scripts/eval/project2_eval.sh A B C > /dev/null
      - name: Claims check (every number in README.md vs. the file it comes from)
        run: python analysis/verify_claims.py
      - name: Tests (log parser, eval writer, layout, parse, imports, fingerprints, mock deploy)
        run: python -m pytest -q -rs
      - name: Mock deploy (both loops, shipped checkpoints)
        run: PY=python bash scripts/deploy/mock_deploy.sh
